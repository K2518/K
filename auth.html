<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#edf6ef"><title>ورود | JAVDAN SAZEH</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Vazirmatn,sans-serif;background:radial-gradient(circle at 15% 10%,#dceee1,transparent 35%),linear-gradient(145deg,#f8fbf8,#eaf4ed);color:#234332;display:grid;place-items:center;padding:22px}
.wrap{width:min(100%,440px)}.brand{text-align:center;margin-bottom:22px}.mark{width:76px;height:76px;margin:auto auto 12px;border-radius:25px;background:linear-gradient(145deg,#cfe5d4,#f9fcf9);border:1px solid #c4d9c9;box-shadow:0 12px 30px #557e6020;display:grid;place-items:center;color:#648d70;font-weight:900;font-size:27px}.brand h1{margin:0;font-size:24px;letter-spacing:1px}.brand p{margin:6px 0;color:#789382;font-size:13px}.card{background:#ffffffed;border:1px solid #d9e9dc;border-radius:25px;padding:25px;box-shadow:0 18px 50px #426d4b14}.tabs{display:flex;gap:8px;background:#eff6f0;padding:5px;border-radius:13px;margin-bottom:20px}.tabs button{flex:1;border:0;border-radius:10px;padding:10px;background:transparent;color:#688472;font:inherit;cursor:pointer}.tabs button.active{background:white;color:#315c3e;box-shadow:0 2px 8px #375e4217}label{display:block;font-size:12px;color:#6c8774;margin:13px 0 6px}input{width:100%;padding:13px 14px;border:1px solid #d7e6da;border-radius:12px;background:#fbfdfb;font:inherit;color:#254432;outline:none}input:focus{border-color:#8bb99a;box-shadow:0 0 0 3px #8bb99a22}.primary{width:100%;margin-top:19px;border:0;border-radius:13px;padding:13px;background:linear-gradient(110deg,#719d7b,#9bbda2);color:white;font:700 15px Vazirmatn;cursor:pointer;box-shadow:0 8px 18px #719d7b30}.msg{display:none;margin-top:14px;padding:12px;border-radius:12px;background:#f0f7f1;color:#587b61;font-size:13px;line-height:1.8}.small{text-align:center;font-size:11px;color:#93a99a;margin-top:16px}.hidden{display:none!important}
</style></head><body><main class="wrap"><div class="brand"><div class="mark">JS</div><h1>JAVDAN SAZEH</h1><p>سامانه هوشمند مدیریت پروژه‌های عمرانی</p></div><section class="card"><div class="tabs"><button id="loginTab" class="active" type="button">ورود</button><button id="signupTab" type="button">عضویت</button></div>
<form id="authForm"><div id="nameWrap" class="hidden"><label>نام و نام خانوادگی</label><input id="fullName" autocomplete="name" placeholder="نام شما"></div><label>ایمیل</label><input id="email" type="email" required autocomplete="email" placeholder="name@example.com"><label>رمز عبور</label><input id="password" type="password" required minlength="6" autocomplete="current-password" placeholder="حداقل ۶ کاراکتر"><button class="primary" id="submitBtn">ورود به حساب</button></form><div id="msg" class="msg" role="status"></div><div class="small">عضویت جدید پس از بررسی و تأیید مدیر فعال می‌شود.</div></section></main>
<script>
const SUPABASE_URL='https://eqpmqpsbaragfuvifrwl.supabase.co';
const SUPABASE_KEY='sb_publishable_lvwJF3To0AiSOo9KzFQYBA_KSMyItli';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let mode='login';const $=id=>document.getElementById(id);
function message(t){$('msg').textContent=t;$('msg').style.display='block'}
function setMode(m){mode=m;$('loginTab').classList.toggle('active',m==='login');$('signupTab').classList.toggle('active',m==='signup');$('nameWrap').classList.toggle('hidden',m!=='signup');$('submitBtn').textContent=m==='login'?'ورود به حساب':'ایجاد حساب کاربری';$('msg').style.display='none';$('password').autocomplete=m==='login'?'current-password':'new-password'}
$('loginTab').onclick=()=>setMode('login');$('signupTab').onclick=()=>setMode('signup');
async function routeUser(){const {data:{user}}=await sb.auth.getUser();if(!user)return;const {data:p,error}=await sb.from('profiles').select('role,is_active,full_name').eq('user_id',user.id).maybeSingle();if(error){message('دریافت وضعیت حساب ممکن نشد: '+error.message);return}if(!p){message('پروفایل حساب هنوز ایجاد نشده است. چند لحظه دیگر دوباره وارد شوید.');return}if(!p.is_active){message('درخواست عضویت شما ثبت شده و در انتظار تأیید مدیر است. پس از تأیید، می‌توانید وارد نرم‌افزار شوید.');return}location.replace(p.role==='super_admin'?'admin.html':'index.html')}
$('authForm').addEventListener('submit',async e=>{e.preventDefault();$('submitBtn').disabled=true;$('msg').style.display='none';try{let result;if(mode==='signup'){result=await sb.auth.signUp({email:$('email').value.trim(),password:$('password').value,options:{data:{full_name:$('fullName').value.trim()}}});if(result.error)throw result.error;if(!result.data.session){message('ثبت‌نام انجام شد. ایمیل خود را برای تأیید باز کنید؛ سپس وارد شوید. بعد از تأیید ایمیل، حساب در انتظار تأیید مدیر خواهد بود.')}else await routeUser()}else{result=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(result.error)throw result.error;await routeUser()}}catch(err){message(err.message||'خطا در ارتباط با سرور')}finally{$('submitBtn').disabled=false}});
sb.auth.getSession().then(({data})=>{if(data.session)routeUser()});
</script></body></html>
