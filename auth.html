<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#edf6ef"><title>ورود | JAVDAN SAZEH</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Vazirmatn,sans-serif;background:radial-gradient(circle at 15% 10%,#dceee1,transparent 35%),linear-gradient(145deg,#f8fbf8,#eaf4ed);color:#234332;display:grid;place-items:center;padding:22px}.wrap{width:min(100%,460px)}.brand{text-align:center;margin-bottom:22px}.mark{width:84px;height:84px;margin:0 auto 12px;border-radius:26px;background:linear-gradient(145deg,#cfe5d4,#fff);border:1px solid #c4d9c9;box-shadow:0 12px 30px #557e6020;display:grid;place-items:center;color:#648d70;font-weight:900;font-size:27px}.brand h1{margin:0;font-size:25px;letter-spacing:2px;color:#244c32}.brand p{margin:6px 0;color:#789382;font-size:13px}.card{background:#ffffffed;border:1px solid #d9e9dc;border-radius:25px;padding:27px;box-shadow:0 18px 50px #426d4b14}.tabs,.method{display:flex;gap:8px;background:#eff6f0;padding:5px;border-radius:13px;margin-bottom:17px}.tabs button,.method button{flex:1;border:0;border-radius:10px;padding:10px;background:transparent;color:#688472;font:inherit;cursor:pointer}.tabs button.active,.method button.active{background:white;color:#315c3e;box-shadow:0 2px 8px #375e4217}label{display:block;font-size:12px;color:#6c8774;margin:13px 0 6px}input{width:100%;padding:13px 14px;border:1px solid #d7e6da;border-radius:12px;background:#fbfdfb;font:inherit;color:#254432;outline:none;min-height:46px}input:focus{border-color:#8bb99a;box-shadow:0 0 0 3px #8bb99a22}.primary{width:100%;margin-top:17px;border:0;border-radius:13px;padding:13px;background:linear-gradient(110deg,#5e9671,#91b99a);color:white;font:700 15px Vazirmatn;cursor:pointer;min-height:48px}.secondary{width:100%;border:0;background:transparent;color:#598365;font:inherit;font-size:12px;padding:12px;cursor:pointer}.msg{display:none;margin-top:14px;padding:12px;border-radius:12px;background:#f0f7f1;color:#587b61;font-size:13px;line-height:1.9}.hidden{display:none!important}.small{text-align:center;font-size:11px;color:#93a99a;margin-top:14px}
</style></head><body><main class="wrap"><div class="brand"><div class="mark">JS</div><h1>JAVDAN SAZEH</h1><p>سامانه هوشمند مدیریت پروژه‌های عمرانی</p></div>
<section class="card"><div class="tabs"><button id="loginTab" class="active" type="button">ورود</button><button id="signupTab" type="button">عضویت</button></div>
<div class="method"><button id="emailTab" class="active" type="button">با ایمیل</button><button id="phoneTab" type="button">با شماره تماس</button></div>
<form id="authForm"><div id="nameWrap" class="hidden"><label>نام و نام خانوادگی</label><input id="fullName" autocomplete="name" placeholder="نام شما"></div>
<div id="emailWrap"><label>آدرس ایمیل</label><input id="email" type="email" autocomplete="email" placeholder="name@example.com"></div>
<div id="phoneWrap" class="hidden"><label>شماره موبایل با کد کشور</label><input id="phone" type="tel" autocomplete="tel" placeholder="+989121234567" dir="ltr"></div>
<div id="passwordWrap"><label>رمز عبور</label><input id="password" type="password" minlength="6" autocomplete="current-password" placeholder="حداقل ۶ کاراکتر"></div>
<div id="otpWrap" class="hidden"><label>کد تأیید پیامک</label><input id="otp" inputmode="numeric" autocomplete="one-time-code" placeholder="کد ارسال‌شده"></div>
<div id="newPasswordWrap" class="hidden"><label>رمز عبور جدید</label><input id="newPassword" type="password" minlength="6" placeholder="حداقل ۶ کاراکتر"></div>
<button class="primary" id="submitBtn">ورود به حساب</button></form>
<button class="secondary" id="forgotBtn">رمز عبور را فراموش کرده‌ام</button><div id="msg" class="msg" role="status"></div><div class="small">برای ورود با شماره موبایل، پیامک باید در تنظیمات پروژه فعال باشد. عضویت جدید پس از تأیید مدیر فعال می‌شود.</div></section></main>
<script>
const SUPABASE_URL='https://eqpmqpsbaragfuvifrwl.supabase.co';
const SUPABASE_KEY='sb_publishable_lvwJF3To0AiSOo9KzFQYBA_KSMyItli';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let mode='login',method='email',step='form';
const $=id=>document.getElementById(id);
function msg(t){$('msg').textContent=t;$('msg').style.display='block'}
function cleanPhone(){return $('phone').value.trim().replace(/[\s()-]/g,'')}
function cleanEmail(){return $('email').value.trim().toLowerCase()}
function friendlyAuthError(err){
 const raw=(err&&err.message)||'',m=raw.toLowerCase();
 if(m.includes('invalid login credentials'))return 'ایمیل یا رمز عبور اشتباه است.';
 if(m.includes('email not confirmed'))return 'ایمیل شما هنوز تأیید نشده است. صندوق ورودی و هرزنامه را بررسی کنید.';
 if(m.includes('user already registered')||m.includes('already been registered'))return 'این ایمیل قبلاً ثبت‌نام کرده است؛ از بخش ورود استفاده کنید.';
 if(m.includes('password should be at least')||m.includes('password is too short'))return 'رمز عبور کوتاه است؛ حداقل ۶ کاراکتر وارد کنید.';
 if(m.includes('invalid email'))return 'فرمت ایمیل معتبر نیست؛ نمونه: name@example.com';
 if(m.includes('rate limit')||m.includes('too many requests'))return 'تعداد درخواست‌ها زیاد شده است. کمی صبر کنید و دوباره تلاش کنید.';
 if(m.includes('network')||m.includes('fetch'))return 'ارتباط با سرور برقرار نشد. اینترنت را بررسی و دوباره تلاش کنید.';
 return raw||'عملیات ناموفق بود. دوباره تلاش کنید.';
}
function showStep(s){step=s;$('passwordWrap').classList.toggle('hidden',s==='otp'||s==='newpass');$('otpWrap').classList.toggle('hidden',s!=='otp');$('newPasswordWrap').classList.toggle('hidden',s!=='newpass');$('forgotBtn').classList.toggle('hidden',mode!=='login'||s!=='form');$('submitBtn').textContent=s==='otp'?'تأیید کد پیامک':s==='newpass'?'ثبت رمز عبور جدید':mode==='login'?'ورود به حساب': 'ایجاد حساب کاربری'}
function setMode(m){mode=m;step='form';$('password').minLength=m==='signup'?6:0;$('password').required=true;$('loginTab').classList.toggle('active',m==='login');$('signupTab').classList.toggle('active',m==='signup');$('nameWrap').classList.toggle('hidden',m!=='signup');$('msg').style.display='none';showStep('form')}
function setMethod(m){method=m;$('emailTab').classList.toggle('active',m==='email');$('phoneTab').classList.toggle('active',m==='phone');$('emailWrap').classList.toggle('hidden',m!=='email');$('phoneWrap').classList.toggle('hidden',m!=='phone');$('email').required=m==='email';$('phone').required=m==='phone';$('password').autocomplete=mode==='login'?'current-password':'new-password';$('msg').style.display='none';showStep('form')}
$('loginTab').onclick=()=>setMode('login');$('signupTab').onclick=()=>setMode('signup');$('emailTab').onclick=()=>setMethod('email');$('phoneTab').onclick=()=>setMethod('phone');
async function routeUser(){const {data:{user}}=await sb.auth.getUser();if(!user)return;const {data:p,error}=await sb.from('profiles').select('role,is_active,full_name').eq('user_id',user.id).maybeSingle();if(error){msg('دریافت وضعیت حساب ممکن نشد: '+error.message);return}if(!p){msg('پروفایل حساب هنوز ایجاد نشده است. اگر تازه عضو شده‌اید، پس از تأیید پیامک یا ایمیل دوباره وارد شوید.');return}if(!p.is_active){msg('حساب شما در انتظار تأیید مدیر است.');return}location.replace(p.role==='super_admin'?'admin.html':'index.html')}
$('authForm').addEventListener('submit',async e=>{e.preventDefault();$('submitBtn').disabled=true;$('msg').style.display='none';try{
 if(step==='otp'){
   const phone=cleanPhone(),token=$('otp').value.trim();
   const {error}=await sb.auth.verifyOtp({phone,token,type:'sms'});if(error)throw error;
   if(mode==='signup'){msg('شماره تأیید شد. اکنون می‌توانید وارد حساب شوید.');setMode('login');setMethod('phone');return}
   if(step==='otp'&&window.__phoneRecovery){showStep('newpass');msg('شماره تأیید شد؛ رمز عبور جدید را وارد کنید.');return}
   await routeUser();return;
 }
 if(step==='newpass'){const {error}=await sb.auth.updateUser({password:$('newPassword').value});if(error)throw error;window.__phoneRecovery=false;msg('رمز عبور جدید ثبت شد. اکنون می‌توانید وارد شوید.');setMode('login');return}
 if(mode==='signup'){
   let result;
   if(method==='email')result=await sb.auth.signUp({email:cleanEmail(),password:$('password').value,options:{emailRedirectTo:location.origin+location.pathname,data:{full_name:$('fullName').value.trim()}}});
   else result=await sb.auth.signUp({phone:cleanPhone(),password:$('password').value,options:{data:{full_name:$('fullName').value.trim()}}});
   if(result.error)throw result.error;
   if(method==='phone'&&!result.data.session){window.__phoneRecovery=false;showStep('otp');msg('کد تأیید به شماره شما پیامک شد.');}
   else if(method==='email'&&!result.data.session)msg('ثبت‌نام انجام شد. ایمیل خود را برای تأیید باز کنید؛ سپس وارد شوید. حساب پس از تأیید مدیر فعال می‌شود.');
   else await routeUser();
 }else{
   const result=method==='email'?await sb.auth.signInWithPassword({email:cleanEmail(),password:$('password').value}):await sb.auth.signInWithPassword({phone:cleanPhone(),password:$('password').value});
   if(result.error)throw result.error;await routeUser();
 }
 }catch(err){msg(friendlyAuthError(err))}finally{$('submitBtn').disabled=false}});
$('forgotBtn').onclick=async()=>{try{if(method==='email'){const email=cleanEmail();if(!email){msg('ابتدا ایمیل خود را وارد کنید.');return}const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(error)throw error;msg('لینک بازیابی رمز عبور به ایمیل شما ارسال شد. پوشه هرزنامه را هم بررسی کنید.')}else{const phone=cleanPhone();if(!phone){msg('ابتدا شماره موبایل را وارد کنید.');return}const {error}=await sb.auth.signInWithOtp({phone,options:{shouldCreateUser:false}});if(error)throw error;window.__phoneRecovery=true;showStep('otp');msg('کد تأیید برای بازیابی به شماره شما ارسال شد. پس از وارد کردن کد، رمز جدید را تعیین کنید.')}}catch(err){msg(friendlyAuthError(err))}};
let recoveryPending = location.hash.includes('type=recovery') || new URLSearchParams(location.search).get('type')==='recovery';
sb.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY'){recoveryPending=true;showStep('newpass');msg('رمز عبور جدید خود را تعیین کنید.')}});
sb.auth.getSession().then(({data})=>{if(data.session&&!recoveryPending)routeUser()});
</script></body></html>
