<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت | JAVDAN SAZEH</title><link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>*{box-sizing:border-box}body{margin:0;background:#f2f8f3;color:#274633;font-family:Vazirmatn,sans-serif}.top{background:#fff;border-bottom:1px solid #dce9de;padding:18px 5%;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.top h1{font-size:19px;margin:0}.top small{color:#809987}.wrap{max-width:1100px;margin:28px auto;padding:0 18px}.hero{background:linear-gradient(115deg,#dceee0,#fafffb);border:1px solid #d3e6d7;border-radius:22px;padding:22px;margin-bottom:20px}.hero h2{margin:0 0 5px}.hero p{margin:0;color:#708b78;font-size:13px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0}.stat,.panel{background:white;border:1px solid #dfebe1;border-radius:17px;padding:17px}.stat b{font-size:25px;display:block;color:#679273}.stat span{font-size:12px;color:#809887}.panel h3{margin:0 0 14px;font-size:16px}.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid #edf3ee;flex-wrap:wrap}.item:last-child{border:0}.meta{font-size:12px;color:#7c9382}.actions{display:flex;gap:7px;flex-wrap:wrap}button,select{font:inherit;border:1px solid #d7e7da;border-radius:10px;padding:8px 12px;background:#f7fbf7;color:#42674c;cursor:pointer}.ok{background:#719d7b;color:white;border-color:#719d7b}.danger{color:#b85d5d}.notice{padding:14px;border-radius:12px;background:#fff7e8;color:#97733c;font-size:13px;margin:12px 0}.empty{padding:20px;color:#8aa08f;text-align:center}.hidden{display:none}</style></head><body><header class="top"><div><h1>JAVDAN SAZEH · پنل مدیریت کل</h1><small id="who">در حال بررسی دسترسی…</small></div><div class="actions"><button onclick="location.href='index.html'">نمای برنامه</button><button id="refresh">به‌روزرسانی</button><button id="logout">خروج</button></div></header><main class="wrap"><section class="hero"><h2>مدیریت اعضا و دسترسی‌ها</h2><p>درخواست‌های عضویت را بررسی کنید و پس از تأیید، نقش هر عضو را تعیین کنید.</p></section><div id="notice" class="notice hidden"></div><section class="stats"><div class="stat"><b id="pendingCount">—</b><span>در انتظار تأیید</span></div><div class="stat"><b id="activeCount">—</b><span>حساب‌های فعال</span></div><div class="stat"><b id="managerCount">—</b><span>مدیران پروژه</span></div></section><section class="panel"><h3>درخواست‌های عضویت</h3><div id="pending"><div class="empty">در حال دریافت اطلاعات…</div></div></section><section class="panel" style="margin-top:16px"><h3>اعضای فعال</h3><div id="members"><div class="empty">در حال دریافت اطلاعات…</div></div></section></main>
<script>
const sb=window.supabase.createClient('https://eqpmqpsbaragfuvifrwl.supabase.co','sb_publishable_lvwJF3To0AiSOo9KzFQYBA_KSMyItli');const $=id=>document.getElementById(id);let me;
function note(t){$('notice').textContent=t;$('notice').classList.remove('hidden')}
async function boot(){const {data:{user}}=await sb.auth.getUser();if(!user){location.replace('auth.html');return}const {data:p,error}=await sb.from('profiles').select('*').eq('user_id',user.id).maybeSingle();if(error||!p||p.role!=='super_admin'||!p.is_active){await sb.auth.signOut();location.replace('auth.html');return}me=p;$('who').textContent=p.full_name||p.email;await load()}
async function load(){const {data:all,error}=await sb.from('profiles').select('user_id,email,full_name,role,is_active,created_at').order('created_at',{ascending:false});if(error){note('خطا در دریافت اعضا: '+error.message);return}const pending=all.filter(x=>!x.is_active&&x.role!=='super_admin'),active=all.filter(x=>x.is_active);$('pendingCount').textContent=pending.length;$('activeCount').textContent=active.length;$('managerCount').textContent=active.filter(x=>x.role==='project_manager').length;
$('pending').innerHTML=pending.length?pending.map(x=>row(x,true)).join(''):'<div class="empty">درخواست تأییدنشده‌ای وجود ندارد.</div>';
$('members').innerHTML=active.map(x=>row(x,false)).join('')}
function row(x,isPending){const safe=(x.full_name||'بدون نام').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const email=(x.email||'').replace(/[&<>"]/g,'');return '<div class="item"><div><b>'+safe+'</b><div class="meta">'+email+' · '+x.role+'</div></div><div class="actions">'+(isPending?'<select id="role-'+x.user_id+'"><option value="user">کاربر</option><option value="project_manager">مدیر پروژه</option></select><button class="ok" onclick="approve(\''+x.user_id+'\')">تأیید عضویت</button>':'<select id="role-'+x.user_id+'" onchange="changeRole(\''+x.user_id+'\',this.value)"><option value="user" '+(x.role==='user'?'selected':'')+'>کاربر</option><option value="project_manager" '+(x.role==='project_manager'?'selected':'')+'>مدیر پروژه</option></select><button class="danger" onclick="deactivate(\''+x.user_id+'\')">غیرفعال‌سازی</button>')+'</div></div>'}
async function approve(id){const role=$('role-'+id).value;const {error}=await sb.from('profiles').update({role,is_active:true,updated_at:new Date().toISOString()}).eq('user_id',id);if(error){note('تأیید انجام نشد: '+error.message);return}await audit('member_approved',id,{role});await load()}
async function changeRole(id,role){const {error}=await sb.from('profiles').update({role,updated_at:new Date().toISOString()}).eq('user_id',id);if(error){note('تغییر نقش انجام نشد: '+error.message);await load();return}await audit('member_role_changed',id,{role})}
async function deactivate(id){if(!confirm('این حساب غیرفعال شود؟'))return;const {error}=await sb.from('profiles').update({is_active:false,updated_at:new Date().toISOString()}).eq('user_id',id);if(error){note('غیرفعال‌سازی انجام نشد: '+error.message);return}await audit('member_deactivated',id,{});await load()}
async function audit(action,id,details){await sb.from('audit_logs').insert({actor_id:me.user_id,action,entity_type:'profile',entity_id:id,details})}
$('refresh').onclick=load;$('logout').onclick=async()=>{await sb.auth.signOut();location.replace('auth.html')};boot();
</script></body></html>
